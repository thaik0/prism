[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-storage"
version = "0.1.0"
description = "Predictive storage-tiering research system"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scikit-learn",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
